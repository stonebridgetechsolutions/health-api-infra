name: Deploy Health API

on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  GCP_REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/health-api-repo/health-api
  CLUSTER: health-api-cluster

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Lint
        run: flake8 app/ --max-line-length=120 --exclude=app/tests

      - name: Test
        run: python -m pytest app/tests/ -v

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ./app
          exit-code: "1"
          severity: CRITICAL

  build-push:
    needs: [lint-test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGISTRY --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install gke-gcloud-auth-plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials $CLUSTER --region $GCP_REGION

      - name: Fetch DB credentials from Secret Manager
        run: |
          DB_HOST=$(gcloud secrets versions access latest --secret=db-host --project=$GCP_PROJECT)
          DB_PASSWORD=$(gcloud secrets versions access latest --secret=db-password --project=$GCP_PROJECT)
          echo "::add-mask::$DB_PASSWORD"
          echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV

      - name: Deploy to staging
        run: |
          helm upgrade --install health-api ./helm/health-api \
            -n staging --create-namespace \
            -f ./helm/health-api/values-staging.yaml \
            --set image.repository=$IMAGE \
            --set image.tag=${{ github.sha }} \
            --set database.host=$DB_HOST \
            --set database.password=$DB_PASSWORD \
            --wait --timeout 5m

  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install gke-gcloud-auth-plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials $CLUSTER --region $GCP_REGION

      - name: Fetch DB credentials from Secret Manager
        run: |
          DB_HOST=$(gcloud secrets versions access latest --secret=db-host --project=$GCP_PROJECT)
          DB_PASSWORD=$(gcloud secrets versions access latest --secret=db-password --project=$GCP_PROJECT)
          echo "::add-mask::$DB_PASSWORD"
          echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV

      - name: Deploy to production
        run: |
          helm upgrade --install health-api ./helm/health-api \
            -n production --create-namespace \
            -f ./helm/health-api/values-prod.yaml \
            --set image.repository=$IMAGE \
            --set image.tag=${{ github.sha }} \
            --set database.host=$DB_HOST \
            --set database.password=$DB_PASSWORD \
            --wait --timeout 5m
