image:
  repository: CHANGEME
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilization: 70

probes:
  liveness:
    path: /health
    port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /ready
    port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5

networkPolicy:
  enabled: true

pdb:
  minAvailable: 1

resourceQuota:
  enabled: true
  cpu: "2"
  memory: 2Gi
  pods: "20"

database:
  enabled: false
  host: ""
  password: ""
  name: healthapi
  user: healthapi
